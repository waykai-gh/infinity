services:
  bot:
    build: ./bot
    image: telegram-bot 
    container_name: telegram-bot
    env_file:
      - ./bot/.env
    network_mode: host
    depends_on:
      - db
    restart: unless-stopped  
  db:
    image: postgres:16
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: vpn-postgres
    restart: always
    environment:
      POSTGRES_DB: vpn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"   # можно убрать наружу, если не нужен доступ извне
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vpn"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db_data:

networks:
  app-network:
    driver: bridge
